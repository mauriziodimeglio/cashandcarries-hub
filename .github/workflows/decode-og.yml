name: Decode Open Graph image
on:
  push:
    branches: [main]
    paths:
      - og.png.b64
      - .github/workflows/decode-og.yml
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and commit PNG
        run: |
          set -euo pipefail
          base64 -d og.png.b64 > og.png
          file og.png
          git add og.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "PNG unchanged"
            exit 0
          fi
          git commit -m "Add decoded FitVerse hub Open Graph PNG"
          git push
